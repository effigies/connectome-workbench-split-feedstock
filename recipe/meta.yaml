{% set name = "connectome-workbench" %}
{% set version = "2.1.0" %}
{% set build = 0 %}

{% set build = build + 100 %}  # [build_variant == "qt6"]

package:
  name: {{ name }}-split
  version: {{ version }}

source:
  url: https://github.com/Washington-University/workbench/archive/v{{ version }}.tar.gz
  sha256: a6bd9cf06cb7a734883866b862219b1a1128557e0d23aa7767d5028e28a45901
  patches:
    - patches/0001-chore-build-Find-QuaZip-library.patch
    # Included in v2.1.0-222-gb08bb2854, remove after next release
    - patches/0001-FreeType-2.13-changed-a-type-from-char-to-unsigned-c.patch
    - patches/0002-Another-fix-for-FreeType-2.13-by-adding-a-char-cast-.patch

build:
  number: {{ build }}
  string: "{{ build_variant }}_h{{ PKG_HASH }}_{{ build }}"
  skip: true  # [osx or win]

requirements:
  build:
    - {{ compiler('cxx') }}
    - {{ stdlib('c') }}
    # cmake max: https://github.com/Washington-University/workbench/blob/1b9221db6d9ead4f6337a1981ab419ea3de55031/src/CMakeLists.txt#L4
    - cmake >=3.5,<4.0
    - ninja
    - pkg-config
    - qwt
    # OpenMP
    - llvm-openmp  # [osx]
    - libgomp      # [linux]
    # libGL
    - {{ cdt('mesa-libgl-devel') }}  # [linux and build_variant == "qt5"]
    - libgl-devel                    # [linux]
    - libglx-devel                   # [linux]
  host:
    - noqt6                          # [build_variant == "qt5"]
    - noqt5                          # [build_variant == "qt6"]
    - qt-main                        # [build_variant == "qt5"]
    - qt6-main >6                    # [build_variant == "qt6"]
    - glib                           # [linux]
    - openssl
    # 1.2 is ABI compatible with 1.3, so this provides more flexibility
    - libzlib =1.2                   # [build_variant == "qt5"]
    # qt6 is build with 1.3
    - libzlib =1.3                   # [build_variant == "qt6"]
    - zlib
    - quazip <1.4                    # [linux and build_variant == "qt5"]
    - quazip                         # [linux and build_variant == "qt6"]
    - freetype
    - libglu                         # [linux]
    - glew                           # [windows]
    - mesalib <25.1                  # [linux and build_variant == "qt5"]
    - mesalib                        # [linux and build_variant == "qt6"]

test:
  commands:
    - wb_view -help
    - wb_command -version
    - wb_shortcuts -help

outputs:
  - name: {{ name }}-gui
    # build/host requirements should exactly match the root requirements
    requirements:
      build:
        - {{ compiler('cxx') }}
        - {{ stdlib('c') }}
        # cmake max: https://github.com/Washington-University/workbench/blob/1b9221db6d9ead4f6337a1981ab419ea3de55031/src/CMakeLists.txt#L4
        - cmake >=3.5,<4.0
        - ninja
        - pkg-config
        - qwt
        # OpenMP
        - llvm-openmp  # [osx]
        - libgomp      # [linux]
        # libGL
        - {{ cdt('mesa-libgl-devel') }}  # [linux and build_variant == "qt5"]
        - libgl-devel                    # [linux]
        - libglx-devel                   # [linux]
      host:
        - noqt6                          # [build_variant == "qt5"]
        - noqt5                          # [build_variant == "qt6"]
        - qt-main                        # [build_variant == "qt5"]
        - qt6-main >6                    # [build_variant == "qt6"]
        - openssl
        - glib                           # [linux]
        - libzlib =1.2                   # [build_variant == "qt5"]
        - libzlib =1.3                   # [build_variant == "qt6"]
        - zlib
        - quazip <1.4                    # [linux and build_variant == "qt5"]
        - quazip                         # [linux and build_variant == "qt6"]
        - freetype
        - libglu                         # [linux]
        - glew                           # [windows]
        - mesalib <25.1                  # [linux and build_variant == "qt5"]
        - mesalib                        # [linux and build_variant == "qt6"]
      run:
        - libgl                          # [linux]
        - libglu                         # [linux]
        - mesalib <25.1                  # [linux and build_variant == "qt5"]
        - mesalib                        # [linux and build_variant == "qt6"]
        - quazip <1.4                    # [linux and build_variant == "qt5"]
        - quazip                         # [linux and build_variant == "qt6"]
    files:
      include:
        - bin/wb_view
    test:
      commands:
        - wb_view -help
  - name: {{ name }}-cli
    # build/host requirements should exactly match the root requirements
    requirements:
      build:
        - {{ compiler('cxx') }}
        - {{ stdlib('c') }}
        # cmake max: https://github.com/Washington-University/workbench/blob/1b9221db6d9ead4f6337a1981ab419ea3de55031/src/CMakeLists.txt#L4
        - cmake >=3.5,<4.0
        - ninja
        - pkg-config
        - qwt
        # OpenMP
        - llvm-openmp  # [osx]
        - libgomp      # [linux]
        # libGL
        - {{ cdt('mesa-libgl-devel') }}  # [linux and build_variant == "qt5"]
        - libgl-devel                    # [linux]
        - libglx-devel                   # [linux]
      host:
        - noqt6                          # [build_variant == "qt5"]
        - noqt5                          # [build_variant == "qt6"]
        - qt-main                        # [build_variant == "qt5"]
        - qt6-main >6                    # [build_variant == "qt6"]
        - openssl
        - glib                           # [linux]
        - libzlib =1.2                   # [build_variant == "qt5"]
        - libzlib =1.3                   # [build_variant == "qt6"]
        - zlib
        - quazip <1.4                    # [linux and build_variant == "qt5"]
        - quazip                         # [linux and build_variant == "qt6"]
        - freetype
        - libglu                         # [linux]
        - glew                           # [windows]
        - mesalib <25.1                  # [linux and build_variant == "qt5"]
        - mesalib                        # [linux and build_variant == "qt6"]
      run:
        - libgl                          # [linux]
        - libglu                         # [linux]
        - mesalib <25.1                  # [linux and build_variant == "qt5"]
        - mesalib                        # [linux and build_variant == "qt6"]
        - quazip <1.4                    # [linux and build_variant == "qt5"]
        - quazip                         # [linux and build_variant == "qt6"]
    files:
      include:
        - bin/wb_command
        - bin/wb_shortcuts
        - share/bash-completion/completions/*
    test:
      commands:
        - wb_command -version
        - wb_shortcuts -help
  - name: {{ name }}
    requirements:
      run:
        - {{ pin_subpackage('connectome-workbench-cli', exact=True) }}
        - {{ pin_subpackage('connectome-workbench-gui', exact=True) }}
    test:
      commands:
        - wb_view -help
        - wb_command -version
        - wb_shortcuts -help

about:
  home: https://www.humanconnectome.org/software/connectome-workbench
  summary: 'Neuroimaging utility for the Human Connectome Project'
  description: |
    Connectome Workbench is an open source, freely available visualization and discovery
    tool used to map neuroimaging data, especially data generated by the Human
    Connectome Project.
  license: GPL-2.0-only
  license_family: GPL
  license_file:
    - LICENSE
    - src/CZIlib/LICENSE
    - src/QxtCore/LICENSE_qxt
    - src/kloewe/cpuinfo/LICENSE
    - src/kloewe/dot/LICENSE
  doc_url: https://humanconnectome.org/software/workbench-command
  dev_url: https://github.com/Washington-University/workbench

extra:
  recipe-maintainers:
    - coalsont
    - effigies
